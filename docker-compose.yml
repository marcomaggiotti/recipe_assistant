# Compose file for running/developing this repo's services locally. pizza-service and
# topping-service are built from the SAME image (this repo's single Dockerfile) - which
# app actually runs is picked at container startup via the SERVICE env var (see
# docker-entrypoint.sh).
services:
  pizza-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SERVICE: pizza-service
      DB_BACKEND: ${DB_BACKEND:-sqlite}

  topping-service:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      SERVICE: topping-service
      TOPPING_DB_BACKEND: ${TOPPING_DB_BACKEND:-sqlite}

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pizza_db
    ports:
      - "5432:5432"
    volumes:
      - pizza_postgres_data:/var/lib/postgresql/data

volumes:
  pizza_postgres_data:
