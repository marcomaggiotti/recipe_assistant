<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Recipe</title>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<nav class="topnav"><div class="inner">
  <a class="brand" href="/">Pizza Service</a>
  <a class="navlink" href="/flour-explorer">Flour Explorer</a>
  <a class="navlink" href="/flour-products/new">Add Flour Product</a>
  <a class="navlink active" href="/new-recipe">New Recipe</a>
</div></nav>
<div class="wrap">
  <header class="page-head">
    <h1>New Recipe</h1>
    <p class="subtitle">Build a dough formula (pizza or bread) from a flour blend and an optional pre-ferment, and save it.</p>
    <p class="source-note">Flour options from <a href="__FLOUR_SERVICE_URL__/docs" target="_blank" rel="noopener">flour-service</a>; saved via this service's own <code>POST /recipes</code>.</p>
  </header>

  <form class="panel grid-fields" id="recipe-form">
    <div class="field wide">
      <label for="f-name">Recipe name (optional)</label>
      <input id="f-name" type="text" placeholder="e.g. Sunday country loaf">
    </div>
    <div class="field">
      <label for="f-ballweight">Ball weight (g, optional)</label>
      <input id="f-ballweight" type="number" min="1" step="1" placeholder="250">
    </div>

    <div class="field wide">
      <label>Flour blend (baker's %, don't need to sum to 100)</label>
      <div id="blend-rows"></div>
      <button type="button" id="add-row-btn" style="align-self:flex-start;">+ Add flour</button>
    </div>

    <div class="field wide">
      <label><input type="checkbox" id="f-use-preferment"> Build a pre-ferment</label>
    </div>

    <div id="preferment-panel" style="display:none;" class="field wide">
      <div class="field">
        <label for="f-preferment-source">Pre-ferment source</label>
        <select id="f-preferment-source">
          <option value="inline">Inline components (e.g. biga 60% / poolish 40%)</option>
        </select>
      </div>
      <div class="field">
        <label for="f-preferment-pct">Pre-ferment % of total flour</label>
        <input id="f-preferment-pct" type="number" min="0" max="100" step="1" placeholder="40">
      </div>
      <div id="preferment-inline-fields" class="field wide">
        <label>Named components (percentages must sum to 100)</label>
        <div id="preferment-rows"></div>
        <button type="button" id="add-preferment-row-btn" style="align-self:flex-start;">+ Add component</button>
      </div>
    </div>

    <details class="advanced">
      <summary>Advanced overrides &amp; API key</summary>
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 16px; margin-top:10px;">
        <div class="field"><label for="f-hydration">Hydration % (optional)</label><input id="f-hydration" type="number" step="0.1" placeholder="62"></div>
        <div class="field"><label for="f-salt">Salt % (optional)</label><input id="f-salt" type="number" step="0.1" placeholder="2.5"></div>
        <div class="field"><label for="f-oil">Oil % (optional)</label><input id="f-oil" type="number" step="0.1" placeholder="0"></div>
        <div class="field"><label for="f-yeast">Yeast % (optional)</label><input id="f-yeast" type="number" step="0.01" placeholder="default"></div>
        <div class="field"><label for="f-apikey">API key (only if this service requires one)</label><input id="f-apikey" type="password" autocomplete="off" placeholder="X-API-Key"></div>
      </div>
    </details>

    <div class="actions-row">
      <button type="submit" class="primary">Save recipe</button>
    </div>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="result" class="panel" style="display:none;"></div>

  <h2 style="font-size:1.05rem;">Recently saved</h2>
  <div id="list-status" class="status-line"></div>
  <div id="recent-list"></div>
</div>

<script>
(function () {
  const FLOUR_SERVICE_BASE = "__FLOUR_SERVICE_URL__";
  let blendRowCount = 0;
  let prefermentRowCount = 0;

  const els = {
    form: document.getElementById("recipe-form"),
    name: document.getElementById("f-name"),
    ballWeight: document.getElementById("f-ballweight"),
    blendRows: document.getElementById("blend-rows"),
    addRowBtn: document.getElementById("add-row-btn"),
    usePreferment: document.getElementById("f-use-preferment"),
    prefermentPanel: document.getElementById("preferment-panel"),
    prefermentSource: document.getElementById("f-preferment-source"),
    prefermentPct: document.getElementById("f-preferment-pct"),
    prefermentInlineFields: document.getElementById("preferment-inline-fields"),
    prefermentRows: document.getElementById("preferment-rows"),
    addPrefermentRowBtn: document.getElementById("add-preferment-row-btn"),
    hydration: document.getElementById("f-hydration"),
    salt: document.getElementById("f-salt"),
    oil: document.getElementById("f-oil"),
    yeast: document.getElementById("f-yeast"),
    apikey: document.getElementById("f-apikey"),
    status: document.getElementById("status"),
    result: document.getElementById("result"),
    listStatus: document.getElementById("list-status"),
    recentList: document.getElementById("recent-list"),
  };

  function authHeaders(json) {
    const key = els.apikey.value.trim();
    const headers = key ? { "X-API-Key": key } : {};
    if (json) headers["Content-Type"] = "application/json";
    return headers;
  }

  async function ownFetch(path, options) {
    const res = await fetch(path, { ...options, headers: { ...authHeaders(!!options?.body), ...(options?.headers || {}) } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || (res.status + " " + res.statusText));
    return body;
  }

  async function flourServiceFetch(path) {
    const res = await fetch(FLOUR_SERVICE_BASE + path);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    return res.json();
  }

  function setStatus(el, text, cls) {
    el.textContent = text || "";
    el.classList.remove("error", "ok");
    if (cls) el.classList.add(cls);
  }

  function addBlendRow(flourOptions) {
    blendRowCount += 1;
    const row = document.createElement("div");
    row.className = "blend-row";
    const select = document.createElement("select");
    select.innerHTML = flourOptions;
    select.required = true;
    const ash = document.createElement("input");
    ash.type = "number"; ash.step = "0.01"; ash.min = "0"; ash.max = "3"; ash.placeholder = "ash% (optional)";
    const percent = document.createElement("input");
    percent.type = "number"; percent.step = "0.1"; percent.min = "0"; percent.required = true; percent.placeholder = "%";
    percent.value = blendRowCount === 1 ? "70" : blendRowCount === 2 ? "30" : "";
    const removeBtn = document.createElement("button");
    removeBtn.type = "button"; removeBtn.textContent = "Remove";
    removeBtn.addEventListener("click", () => row.remove());

    const wrapField = (labelText, input) => {
      const field = document.createElement("div");
      field.className = "field";
      const label = document.createElement("label");
      label.textContent = labelText;
      field.appendChild(label);
      field.appendChild(input);
      return field;
    };

    row.appendChild(wrapField("Flour", select));
    row.appendChild(wrapField("Ash %", ash));
    row.appendChild(wrapField("Percent", percent));
    row.appendChild(removeBtn);
    els.blendRows.appendChild(row);
  }

  function addPrefermentRow(name, percentage) {
    prefermentRowCount += 1;
    const row = document.createElement("div");
    row.className = "blend-row";
    const nameInput = document.createElement("input");
    nameInput.type = "text"; nameInput.required = true; nameInput.placeholder = "e.g. biga";
    nameInput.value = name || "";
    const percentInput = document.createElement("input");
    percentInput.type = "number"; percentInput.step = "1"; percentInput.min = "0"; percentInput.max = "100"; percentInput.required = true;
    percentInput.placeholder = "%";
    percentInput.value = percentage !== undefined ? percentage : "";
    const removeBtn = document.createElement("button");
    removeBtn.type = "button"; removeBtn.textContent = "Remove";
    removeBtn.addEventListener("click", () => row.remove());

    const wrapField = (labelText, input) => {
      const field = document.createElement("div");
      field.className = "field";
      const label = document.createElement("label");
      label.textContent = labelText;
      field.appendChild(label);
      field.appendChild(input);
      return field;
    };

    row.appendChild(wrapField("Component name", nameInput));
    row.appendChild(wrapField("% of preferment", percentInput));
    row.appendChild(removeBtn);
    els.prefermentRows.appendChild(row);
  }

  async function loadFlourOptions() {
    const data = await flourServiceFetch("/flours");
    const sorted = [...data.items].sort((a, b) => (a.names?.en || a.id).localeCompare(b.names?.en || b.id));
    const options = sorted.map((f) => '<option value="' + f.id + '">' + (f.names?.en || f.id) + " (" + f.id + ")</option>").join("");
    addBlendRow(options);
    addBlendRow(options);
  }

  async function loadPreFermentTypes() {
    try {
      const data = await ownFetch("/pre-ferment-types");
      for (const item of data.items) {
        const opt = document.createElement("option");
        opt.value = item.id;
        opt.textContent = item.id + " (" + item.preferments.map((p) => p.name + " " + p.percentage + "%").join(" / ") + ")";
        els.prefermentSource.appendChild(opt);
      }
    } catch (e) {
      // pre-ferment-types requires DB_BACKEND=postgres - just skip saved blends if unavailable.
    }
  }

  els.usePreferment.addEventListener("change", () => {
    els.prefermentPanel.style.display = els.usePreferment.checked ? "" : "none";
  });

  els.prefermentSource.addEventListener("change", () => {
    els.prefermentInlineFields.style.display = els.prefermentSource.value === "inline" ? "" : "none";
  });

  els.addRowBtn.addEventListener("click", async () => {
    try {
      const data = await flourServiceFetch("/flours");
      const sorted = [...data.items].sort((a, b) => (a.names?.en || a.id).localeCompare(b.names?.en || b.id));
      const options = sorted.map((f) => '<option value="' + f.id + '">' + (f.names?.en || f.id) + " (" + f.id + ")</option>").join("");
      addBlendRow(options);
    } catch (e) {
      setStatus(els.status, "Couldn't reach flour-service: " + e.message, "error");
    }
  });

  els.addPrefermentRowBtn.addEventListener("click", () => addPrefermentRow());

  function numOrUndefined(input) {
    const v = input.value.trim();
    return v === "" ? undefined : parseFloat(v);
  }

  function collectFlours() {
    const rows = Array.from(els.blendRows.querySelectorAll(".blend-row"));
    return rows.map((row) => {
      const [select, ashField, percentField] = row.querySelectorAll("select, input");
      const flour = { pizza_flours_id: select.value, percent: parseFloat(percentField.value) };
      const ash = ashField.value.trim();
      if (ash !== "") flour["ash%"] = parseFloat(ash);
      return flour;
    });
  }

  function collectPreFerment() {
    if (!els.usePreferment.checked) return undefined;
    const preFerment = {};
    const pct = numOrUndefined(els.prefermentPct);
    if (pct !== undefined) preFerment.percentage = pct;
    if (els.prefermentSource.value === "inline") {
      const rows = Array.from(els.prefermentRows.querySelectorAll(".blend-row"));
      preFerment.components = rows.map((row) => {
        const [nameField, percentField] = row.querySelectorAll("input");
        return { name: nameField.value.trim(), percentage: parseFloat(percentField.value) };
      });
    } else {
      preFerment.type_id = els.prefermentSource.value;
    }
    return preFerment;
  }

  function describePreFerment(preFerment) {
    if (!preFerment) return "Direct dough (no pre-ferment)";
    const blend = preFerment.components.map((c) => c.name + " " + c.percentage + "%").join(" / ");
    return blend + " preferment, " + preFerment.percentage + "% of total flour";
  }

  function renderResult(recipe) {
    els.result.style.display = "block";
    const flourLines = recipe.ingredients.flours.map((f) => "<li>" + f.pizza_flours_id + " - " + f.percent + "% (" + f.grams + "g)</li>").join("");
    els.result.innerHTML =
      "<h2 style='margin-top:0;font-size:1.05rem;'>Saved: " + (recipe.name || "Recipe") + "</h2>" +
      "<p class='meta-line'>" + describePreFerment(recipe.pre_ferment) + "</p>" +
      "<ul>" + flourLines + "</ul>" +
      "<p class='meta-line'>Flour " + recipe.ingredients_per_ball.flour_g + "g · Water " + recipe.ingredients_per_ball.water_g +
      "g · Salt " + recipe.ingredients_per_ball.salt_g + "g · Oil " + recipe.ingredients_per_ball.oil_g + "g</p>" +
      (recipe.warnings.length ? "<p class='status-line error'>" + recipe.warnings.join(" · ") + "</p>" : "");
  }

  function recentCard(recipe) {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML =
      '<div class="card-body">' +
      '<p class="card-name">' + recipe.name + "</p>" +
      '<p class="card-sub">' + describePreFerment(recipe.pre_ferment) + "</p>" +
      "</div>";
    return el;
  }

  async function loadRecent() {
    setStatus(els.listStatus, "Loading…");
    els.recentList.innerHTML = "";
    try {
      const data = await ownFetch("/recipes?limit=6");
      if (!data.items.length) {
        setStatus(els.listStatus, "No recipes saved yet.");
        return;
      }
      setStatus(els.listStatus, data.count + " saved recipe" + (data.count === 1 ? "" : "s") + ".");
      const grid = document.createElement("div");
      grid.className = "grid";
      for (const recipe of data.items) grid.appendChild(recentCard(recipe));
      els.recentList.appendChild(grid);
    } catch (e) {
      setStatus(els.listStatus, "Couldn't load recent recipes: " + e.message, "error");
    }
  }

  els.form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus(els.status, "Saving…");
    els.result.style.display = "none";
    const body = { ingredients: { flours: collectFlours() } };
    if (els.name.value.trim()) body.name = els.name.value.trim();
    const ballWeight = numOrUndefined(els.ballWeight);
    if (ballWeight !== undefined) body.ball_weight_g = ballWeight;
    const hydration = numOrUndefined(els.hydration);
    if (hydration !== undefined) body.hydration_pct = hydration;
    const salt = numOrUndefined(els.salt);
    if (salt !== undefined) body.salt_pct = salt;
    const oil = numOrUndefined(els.oil);
    if (oil !== undefined) body.oil_pct = oil;
    const yeast = numOrUndefined(els.yeast);
    if (yeast !== undefined) body.yeast_pct = yeast;

    const preFerment = collectPreFerment();
    if (preFerment !== undefined) body.pre_ferment = preFerment;

    try {
      const recipe = await ownFetch("/recipes", { method: "POST", body: JSON.stringify(body) });
      setStatus(els.status, "Recipe saved.", "ok");
      renderResult(recipe);
      loadRecent();
    } catch (e) {
      setStatus(els.status, "Couldn't save recipe: " + e.message, "error");
    }
  });

  addPrefermentRow("biga", 60);
  addPrefermentRow("poolish", 40);
  loadPreFermentTypes();
  loadFlourOptions().catch((e) => setStatus(els.status, "Couldn't reach flour-service: " + e.message, "error"));
  loadRecent();
})();
</script>
</body>
</html>
