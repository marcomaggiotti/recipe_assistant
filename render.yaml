# Render Blueprint for this service: https://render.com/docs/blueprint-spec
#
# From the Render dashboard: New -> Blueprint -> point at this repo. Render will build
# the Dockerfile below and deploy the web service against Azure Cosmos DB for saved
# recipes (DB_BACKEND=cosmos - the flour catalogue itself always comes live from the
# standalone flour-service microservice, see FLOUR_SERVICE_URL/app/flours.py, regardless
# of DB_BACKEND), plus a small Render-managed Postgres database used ONLY for
# pre_ferment_types - that table is Postgres-only regardless of DB_BACKEND (see
# app/pre_ferments.py), so it's wired up independently via its own POSTGRES_URL rather
# than by switching the whole service's backend.
#
# Cosmos DB itself is NOT provisioned by this blueprint (Render doesn't host Cosmos -
# it's an Azure service). Create a Cosmos DB account (NoSQL API) in the Azure Portal
# first, then set COSMOS_ENDPOINT and COSMOS_KEY below (marked sync: false - set them,
# along with API_KEY and ANTHROPIC_API_KEY, in the Render dashboard after the first
# deploy since they're secrets). See README.md's "Deploy to Render" section for the
# step-by-step.
services:
  - type: web
    name: pizza-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVICE_NAME
        value: pizza-service
      - key: DB_BACKEND
        value: cosmos
      - key: COSMOS_ENDPOINT
        sync: false
      - key: COSMOS_KEY
        sync: false
      - key: COSMOS_DATABASE
        value: ai-agent
      - key: COSMOS_CONTAINER
        value: pizza_recipes
      - key: FLOUR_SERVICE_API_KEY
        sync: false
      - key: POSTGRES_URL
        fromDatabase:
          name: pre-ferment-types-db
          property: connectionString
      - key: API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CORS_ALLOW_ORIGINS
        value: "*"

databases:
  - name: pre-ferment-types-db
    plan: free
    databaseName: pre_ferment_types
    user: pizza

# To run the WHOLE service against Render's managed Postgres instead of Cosmos, switch
# DB_BACKEND to "postgres" and drop the COSMOS_* env vars above - POSTGRES_URL (and the
# databases: block) can stay as-is, since /recipes/* and /pre-ferment-types would then
# share the same Postgres database.
